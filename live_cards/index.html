  fbox.innerHTML='';
  const mk=(key,label,color,count)=>{
    const b=document.createElement('button');
    b.className='chip'+(filter===key?' on':''); b.style.setProperty('--c',color);
    b.innerHTML='<span class="sw"></span>'+label+'<span class="n">'+count+'</span>';
    b.onclick=()=>{filter=key;render();};
    fbox.appendChild(b);
  };
  mk('all','全部','#4da3ff',EVENTS.length-hidden.size);
  cats.forEach(c=>{
    const cnt=EVENTS.filter(e=>e.cat===c&&!hidden.has(e.id)).length;
    if(cnt) mk(c,CATS[c].n,CATS[c].c,cnt);
  });
  /* 数据里存在配置未定义的分类 → 自动补一个「其他」筛选项 */
  const known={}; cats.forEach(c=>known[c]=1);
  const orphan=EVENTS.filter(e=>!known[e.cat]&&!hidden.has(e.id)).length;
  if(orphan) mk('__other__',(CONFIG.fallbackCatName||'其他'),'#8b96ad',orphan);
  if(hidden.size) mk('hidden','已隐藏','#8b96ad',hidden.size);
}
renderFilters();

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(filter==='hidden'&&!hidden.size){ filter='all'; renderFilters(); }
  const isHiddenView=(filter==='hidden');
  let ids=order.filter(id=>{
    const e=byId[id];
    if(isHiddenView){
      if(q&&!(e.title+' '+e.sub+' '+e.tags.join(' ')).toLowerCase().includes(q)) return false;
      return hidden.has(id);
    }
    if(hidden.has(id)) return false;
    if(filter==='__other__'){
      const known={}; Object.keys(CATS).forEach(c=>known[c]=1);
      if(known[e.cat]) return false;
    } else if(filter!=='all'&&e.cat!==filter) return false;
    if(hideDone&&done.has(id)) return false;
    if(q){
      const hay=(e.title+' '+e.sub+' '+e.tags.join(' ')+' '+e.quick.map(x=>x.t+x.d).join(' ')+' '+e.fields.map(f=>f.k+f.v).join(' ')+' '+e.tpts.join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const ns=document.getElementById('noticeSlot');
  if(isHiddenView){
    ns.innerHTML='<div class="notice">当前显示 <b>'+hidden.size+'</b> 张已隐藏卡片（不上直播但保留内容）。'+
      '<button class="btn" id="restoreAll">全部恢复</button><button class="btn" id="backAll">返回全部</button></div>';
    document.getElementById('restoreAll').onclick=()=>{
      const n=hidden.size; hidden.clear(); save(); filter='all'; renderFilters(); render(); toast('已恢复 '+n+' 张卡片');
    };
    document.getElementById('backAll').onclick=()=>{filter='all';renderFilters();render();};
  } else ns.innerHTML='';
  wall.innerHTML='';
  ids.forEach((id,i)=>{
    const e=byId[id], c=catOf(e.cat).c, s=sevOf(e.sev).c;
    const d=document.createElement('div');
    d.className='card'+(done.has(id)?' done':'')+(isHiddenView?' hiddenCard':'');
    d.style.setProperty('--c',c); d.style.setProperty('--s',s);
    d.draggable=true; d.dataset.id=id;
    d.innerHTML=
      '<div class="chead">'+
        '<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+
        '<span class="ctag">'+catOf(e.cat).n+'</span>'+
        '<span class="sev"><i></i>'+sevOf(e.sev).n+'</span>'+
        '<button class="hbtn" draggable="false">'+(isHiddenView?'↺ 恢复':'隐藏')+'</button>'+
      '</div>'+
      '<div class="kpis">'+(e.hl||[]).slice(0,4).map(h=>'<div class="kpi"><b>'+esc(h.v)+'</b><span>'+esc(h.l)+'</span></div>').join('')+'</div>'+
      '<div class="ctitle">'+esc(e.title)+'</div>'+
      '<div class="csub">'+esc(e.sub)+'</div>'+
      '<div class="cfoot">'+
        e.tags.slice(0,3).map(t=>'<span class="pill">'+esc(t)+'</span>').join('')+
        '<span class="pill date">'+esc(e.date)+'</span>'+
      '</div>'+
      '<span class="hint">拖动排序 · 点击查看 · 右上'+(isHiddenView?'恢复':'隐藏')+'</span>';
    d.onclick=()=>{ if(justDragged) return; openCard(id); };
    const hb=d.querySelector('.hbtn');
    hb.onclick=ev=>{
      ev.stopPropagation();
      if(isHiddenView){ hidden.delete(id); if(!hidden.size) filter='all'; }
      else { hidden.add(id); done.delete(id); }
      save(); renderFilters(); render();
    };
    wall.appendChild(d);
  });
  const em=document.getElementById('empty');
  em.style.display=ids.length?'none':'block';
  if(!ids.length){
    em.textContent=(q&&!isHiddenView)?'没有匹配的卡片，试试别的关键词或清空搜索框'
      :(hideDone?'当前筛选下没有可显示的卡片（可能被「隐藏已讲」过滤了）':'没有匹配的卡片');
  }
  bhd.classList.toggle('on',filter==='hidden');
  bhd.style.opacity=hidden.size?'':'.45';
  document.getElementById('hn').textContent=hidden.size;
  // 计数已改由顶栏「已隐藏 N」与筛选标签承担，页脚移除后不做额外赋值
}

let dragEl=null, justDragged=false;
function renumber(){
  [...wall.querySelectorAll('.card')].forEach((x,i)=>{
    const n=x.querySelector('.num'); if(n) n.textContent=String(i+1).padStart(2,'0');
  });
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}
wall.addEventListener('dragstart',ev=>{
  if(ev.target.closest('.hbtn')){ ev.preventDefault(); return; }
  const c=ev.target.closest('.card'); if(!c) return;
  wall.classList.add('sorting');
  dragEl=c; c.style.setProperty('--dh',c.getBoundingClientRect().height+'px'); c.classList.add('dragging');
  ev.dataTransfer.effectAllowed='move';
  try{ev.dataTransfer.setData('text/plain',c.dataset.id);}catch(e){}
});
wall.addEventListener('dragend',()=>{
  if(!dragEl) return;
  const movedId=dragEl.dataset.id;
  wall.classList.remove('sorting');
  dragEl.classList.remove('dragging'); dragEl.style.removeProperty('--dh');
  const vis=[...wall.querySelectorAll('.card')].map(x=>x.dataset.id);
  const visSet=new Set(vis), slots=[];
  order.forEach((id,i)=>{ if(visSet.has(id)) slots.push(i); });
  let k=0; slots.forEach(p=>{ order[p]=vis[k++]; });
  dragEl=null;
  justDragged=true; setTimeout(()=>{justDragged=false;},150);
  save(); render();
  const el=wall.querySelector('.card[data-id="'+movedId+'"]');
  if(el){
    el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),900);
    const pos=[...wall.querySelectorAll('.card')].indexOf(el)+1;
    toast('已移到第 '+pos+' 位');
    if(typeof el.scrollIntoView==='function'){ try{ el.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){} }
  }
});
wall.addEventListener('dragover',ev=>{
  if(!dragEl) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect='move';
  const over=ev.target.closest('.card');
  if(!over||over===dragEl) return;
  const r=over.getBoundingClientRect();
  const after=(ev.clientY-r.top)>r.height/2;
  const ref=after?over.nextSibling:over;
  if(ref===dragEl) return;
  wall.insertBefore(dragEl,ref); renumber();
});
wall.addEventListener('drop',ev=>ev.preventDefault());

function visibleIds(){ return [...wall.querySelectorAll('.card')].map(x=>x.dataset.id); }
function openCard(id){ curIdx=visibleIds().indexOf(id); paint(id); mask.classList.add('show'); document.body.style.overflow='hidden'; }
function paint(id){
  const e=byId[id], c=catOf(e.cat).c;
  modal.style.setProperty('--c',c);
  modal.innerHTML=
   '<div class="mtop">'+
     '<button class="mclose" id="x">×</button>'+
     '<div class="mcat"><span class="b">'+catOf(e.cat).n+'</span><span class="d">'+esc(e.date)+'</span>'+
       '<span class="sv">严重度：'+sevOf(e.sev).n+'</span></div>'+
     '<div class="mtitle">'+esc(e.title)+'</div>'+
     '<div class="msub">'+esc(e.sub)+'</div>'+
     '<div class="mtags">'+e.tags.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>'+
   '</div>'+
   '<div class="kpiband">'+e.hl.map(h=>'<div class="kb"><b>'+esc(h.v)+'</b><span>'+esc(h.l)+'</span></div>').join('')+'</div>'+
   '<div class="mbody">'+
     '<div class="sec p1"><div class="shead"><span class="k">1</span><h3>这到底是什么事？有什么影响</h3></div>'+
       '<div class="qs">'+e.quick.map(x=>
         '<div class="q"><span class="qt">'+esc(x.t)+'</span><span class="qd">'+esc(x.d)+'</span></div>').join('')+'</div>'+
     '</div>'+
     '<div class="sec p2"><div class="shead"><span class="k">2</span><h3>技术上到底是怎么回事</h3></div>'+
       '<div class="ft">'+e.fields.map(f=>'<div class="fk">'+esc(f.k)+'</div><div class="fv">'+esc(f.v)+'</div>').join('')+'</div>'+
       '<ul class="tp">'+e.tpts.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>'+
     '</div>'+
     '<div class="sec p3"><div class="shead"><span class="k">3</span><h3>信息来源</h3></div>'+
       '<ul class="refs">'+e.refs.map((r,i)=>'<li><a href="'+esc(r.u)+'" target="_blank" rel="noopener">'+
         '<span class="rn">'+(i+1)+'</span>'+esc(r.t)+'</a><div class="u">'+esc(r.u)+'</div></li>').join('')+'</ul>'+
     '</div>'+
   '</div>'+
   '<div class="mfoot">'+
     '<span class="pos" id="pos"></span>'+
     '<button class="btn" id="prev">← 上一张</button><button class="btn" id="next">下一张 →</button>'+
     '<span class="sep"></span>'+
     '<button class="btn" id="up">↑ 前移</button><button class="btn" id="down">↓ 后移</button>'+
     '<button class="btn'+(done.has(id)?' on':'')+'" id="mk">'+(done.has(id)?'✓ 已讲（点击撤销）':'标记为已讲')+'</button>'+
     '<button class="btn danger" id="hd">'+(hidden.has(id)?'↺ 取消隐藏':'隐藏此卡')+'</button>'+
     '<span class="sp"></span>'+
     '<span class="kbd"><b>ESC</b> 关闭 <b>←</b><b>→</b> 切换 <b>空格</b> 已讲 <b>H</b> 隐藏</span>'+
   '</div>';
  document.getElementById('x').onclick=close;
  document.getElementById('prev').onclick=()=>step(-1);
  document.getElementById('next').onclick=()=>step(1);
  document.getElementById('up').onclick=()=>moveCard(id,-1);
  document.getElementById('down').onclick=()=>moveCard(id,1);
  document.getElementById('mk').onclick=()=>{ done.has(id)?done.delete(id):done.add(id); save(); render(); paint(id); };
  document.getElementById('hd').onclick=()=>{
    const was=hidden.has(id);
    if(was) hidden.delete(id); else { hidden.add(id); done.delete(id); }
    save(); renderFilters(); render();
    if(!was){ close(); toast('已隐藏：'+byId[id].title.slice(0,20)+'…'); } else paint(id);
  };
  const pe=document.getElementById('pos');
  const ids0=visibleIds();
  if(pe) pe.innerHTML='第 <b>'+(ids0.indexOf(id)+1)+'</b> / '+ids0.length+' 张';
  mask.scrollTop=0;
}
function moveCard(id,d){
  const i=order.indexOf(id), j=i+d;
  if(i<0||j<0||j>=order.length) return;
  [order[i],order[j]]=[order[j],order[i]];
  save(); render(); paint(id);
}
function step(d){ const ids=visibleIds(); if(!ids.length) return; curIdx=(curIdx+d+ids.length)%ids.length; paint(ids[curIdx]); }
function close(){ mask.classList.remove('show'); document.body.style.overflow=''; }
mask.onclick=ev=>{ if(ev.target===mask) close(); };
document.addEventListener('keydown',ev=>{
  if(!mask.classList.contains('show')) return;
  if(ev.key==='Escape') close();
  else if(ev.key==='ArrowLeft') step(-1);
  else if(ev.key==='ArrowRight') step(1);
  else if(ev.key===' '){ ev.preventDefault(); const b=document.getElementById('mk'); if(b) b.click(); }
  else if(ev.key==='h'||ev.key==='H'){ const b=document.getElementById('hd'); if(b) b.click(); }
});

/* ---------- 直播留白列 ---------- */
const LG={live:0,cam:0,img:'',text:'',note:''};   // 默认收起
try{
  const g=JSON.parse(localStorage.getItem('cw_gutter2')||'null');
  if(g&&typeof g==='object') Object.assign(LG,g);
}catch(e){}
const gutSave=()=>{ try{ localStorage.setItem('cw_gutter2',JSON.stringify(LG)); }catch(e){} };

const bTheme=document.getElementById('btnTheme');

applyTheme();

/* ---- 按 CONFIG 渲染顶栏品牌信息 ---- */

const bLive=document.getElementById('btnLive');
function applyLive(){

  bLive.classList.toggle('on',!!LG.live);
  bLive.textContent=LG.live?'直播留白 开':'直播留白 关';
}
function toggleLive(v){ LG.live=(v===undefined)?(LG.live?0:1):(v?1:0); gutSave(); applyLive(); }
bLive.onclick=()=>toggleLive();
const gTab=document.getElementById('gutterTab'), gClose=document.getElementById('gutterClose');
gTab.onclick=()=>toggleLive(1);
gClose.onclick=()=>toggleLive(0);

const camSlot=document.getElementById('camSlot'), camToggle=document.getElementById('camToggle');
function applyCam(){
  camSlot.classList.toggle('blank',!!LG.cam);
  camToggle.textContent=LG.cam?'显示':'隐藏';
}
camToggle.onclick=()=>{ LG.cam=LG.cam?0:1; gutSave(); applyCam(); };

const qrImg=document.getElementById('qrImg'), qrFile=document.getElementById('qrFile');
const qrNote=document.getElementById('qrNote');
const PH='<span class="ph">点击选择图片、粘贴，<br>或在下方输入链接生成</span>';
function renderQr(){
  if(LG.text){
    const m=QRLib.make(LG.text,'M');
    if(!m){ qrImg.innerHTML='<span class="ph">内容过长，请缩短后重试</span>'; return; }
    // 用 SVG 渲染：矢量无损、无 canvas 依赖，放大到任意尺寸都清晰
    const n=m.length, Q=6, dim=n+Q*2;
    let path='';
    for(let r=0;r<n;r++){
      let run=0;
      for(let cc=0;cc<=n;cc++){
        const on=(cc<n && m[r][cc]);
        if(on) run++;
        else if(run){ path+='M'+(cc-run+Q)+' '+(r+Q)+'h'+run+'v1h-'+run+'z'; run=0; }
      }
    }
    const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+dim+' '+dim+'" shape-rendering="crispEdges">'+
      '<rect width="'+dim+'" height="'+dim+'" fill="#ffffff"/><path d="'+path+'" fill="#000000"/></svg>';
    qrImg.innerHTML='<img src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'" alt="二维码">';
  } else if(LG.img){
    qrImg.innerHTML='<img src="'+LG.img+'" alt="二维码">';
  } else {
    qrImg.innerHTML=PH;
  }
}
function setQr(dataUrl){
  LG.img=dataUrl||''; LG.text='';
  gutSave(); renderQr();
}
function shrink(src,cb){
  const im=new Image();
  im.onload=()=>{
    const max=520, sc=Math.min(1,max/Math.max(im.width,im.height));
    const cw=Math.round(im.width*sc), ch=Math.round(im.height*sc);
    const c=document.createElement('canvas'); c.width=cw; c.height=ch;
    const g=c.getContext('2d');
    g.fillStyle='#ffffff'; g.fillRect(0,0,cw,ch);
    g.drawImage(im,0,0,cw,ch);
    try{ cb(c.toDataURL('image/jpeg',0.92)); }
    catch(e){ cb(src); }
  };
  im.onerror=()=>cb(src);
  im.src=src;
}
function readFile(f){
  if(!f||!/^image\//.test(f.type)) return;
  const r=new FileReader();
  r.onload=()=>shrink(r.result,d=>setQr(d));
  r.readAsDataURL(f);
}
qrImg.onclick=()=>qrFile.click();
document.getElementById('qrPick').onclick=()=>qrFile.click();
document.getElementById('qrClear').onclick=ev=>{ ev.stopPropagation(); setQr(''); qrText.value=''; qrFile.value=''; };
qrFile.onchange=()=>{ readFile(qrFile.files[0]); qrFile.value=''; };
qrImg.addEventListener('dragover',ev=>{ ev.preventDefault(); qrImg.classList.add('drag'); });
qrImg.addEventListener('dragleave',()=>qrImg.classList.remove('drag'));
qrImg.addEventListener('drop',ev=>{
  ev.preventDefault(); qrImg.classList.remove('drag');
  const f=ev.dataTransfer.files&&ev.dataTransfer.files[0];
  if(f) readFile(f);
});
// 任意位置粘贴图片 → 直接放进二维码位
document.addEventListener('paste',ev=>{
  if(!LG.live) return;
  const it=ev.clipboardData&&ev.clipboardData.items;
  if(!it) return;
  for(let i=0;i<it.length;i++){
    if(it[i].type&&it[i].type.indexOf('image')===0){
      const f=it[i].getAsFile(); if(f){ readFile(f); ev.preventDefault(); }
      return;
    }
  }
});
if(LG.note) qrNote.textContent=LG.note;
qrNote.addEventListener('input',()=>{ LG.note=qrNote.textContent; gutSave(); });
const qrText=document.getElementById('qrText');
function makeFromText(){
  const v=(qrText.value||'').trim();
  if(!v) return;
  LG.text=v; LG.img=''; gutSave(); renderQr();
}
document.getElementById('qrMake').onclick=makeFromText;
qrText.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); makeFromText(); } });
if(LG.text) qrText.value=LG.text;
renderQr();
applyLive(); applyCam();

document.getElementById('q').oninput=render;
const bh=document.getElementById('btnHideDone');
bh.onclick=()=>{ hideDone=!hideDone; bh.classList.toggle('on',hideDone); render(); };
const bhd=document.getElementById('btnHidden');
bhd.onclick=()=>{ filter=(filter==='hidden')?'all':'hidden'; renderFilters(); render(); };
document.getElementById('btnReset').onclick=()=>{ order=DEFAULT_ORDER.slice(); save(); render(); toast('已恢复初始顺序'); };
document.getElementById('btnSortCat').onclick=()=>{
  const idx=c=>cats.indexOf(c);
  order=[...order].sort((a,b)=>idx(byId[a].cat)-idx(byId[b].cat));
  save(); render();
};
const bf=document.getElementById('btnFont');
bf.onclick=()=>{
  const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||1;
  const steps=[0.85,1,1.15,1.3];
  const next=steps[(steps.findIndex(s=>Math.abs(s-cur)<0.01)+1)%steps.length];
  document.documentElement.style.setProperty('--fs',next);
  try{localStorage.setItem('cw_fs',next);}catch(e){}
  bf.textContent='字号 '+({0.85:'S',1:'M',1.15:'L',1.3:'XL'}[next]);
  render();
};
document.getElementById('btnFull').onclick=()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
(function(){
  const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||1;
  bf.textContent='字号 '+({0.85:'S',1:'M',1.15:'L',1.3:'XL'}[cur]||'M');
})();
render();
</script>
